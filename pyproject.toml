[project]
name = "english-whisperer"
version = "0.1.0"
description = "A cross-platform desktop application that generates WAV audio files from English words using offline text-to-speech"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "edge-tts>=6.1.0",  # Microsoft Edge TTS - high quality, free, requires internet
    "pyttsx3>=2.90",  # Offline fallback TTS engine
    "PySide6>=6.5.0",
    "pydub>=0.25.1",  # Audio processing for MP3 to WAV conversion (edge-tts generates MP3)
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[uv]
dev-dependencies = []

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
]
