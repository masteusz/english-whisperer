[project]
name = "english-whisperer"
version = "0.1.0"
description = "A cross-platform desktop application that generates WAV audio files from English words using offline text-to-speech"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[uv]
dev-dependencies = []
